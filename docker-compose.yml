version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stf_transparency_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Optional local Grafana service for dashboards
  grafana:
    image: grafana/grafana-oss:latest
    container_name: stf_transparency_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
    depends_on:
      - api
    restart: unless-stopped

volumes:
  grafana_storage:

