name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Full Medallion Pipeline
        run: |
          python -m pipelines.runner --sample --rows 1000

      - name: Run Data Quality Gate Contracts
        run: |
          python -m quality.runner

      - name: Test Lakehouse Delta and Iceberg Exporter
        run: |
          python -m pipelines.export.lake_formats --all

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

  docker-build:
    name: Docker Build & Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: stf-transparency-platform:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

