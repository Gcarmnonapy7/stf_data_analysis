[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stf-transparency-platform"
version = "0.1.0"
description = "Open-source data engineering and analytics platform for Brazilian Supreme Federal Court (STF) public data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "STF Transparency Platform Contributors"}
]
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "pipelines*", "transformations*", "quality*", "analytics*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
